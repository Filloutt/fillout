name: Code checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: contracts
      - run: npm run test:security
        working-directory: contracts
